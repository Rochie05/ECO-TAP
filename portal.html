<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#F4F5EB" />
    <meta name="description" content="ECO-TAP staff and administrator demo portal." />
    <title>ECO-TAP | Staff portal</title>
    <style>
      body { margin: 0; background: #F4F5EB; color: #174B35; font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; }
      .boot-screen { min-height: 100vh; display: grid; place-items: center; padding: 24px; box-sizing: border-box; }
      .boot-content { width: min(280px, 100%); text-align: center; }
      .boot-mark { width: 62px; height: 62px; display: grid; place-items: center; margin: 0 auto 17px; border-radius: 20px; background: #174B35; color: #F4F5EB; font-size: 2.5rem; }
      .boot-content strong { display: block; font-size: 1.2rem; letter-spacing: .06em; }
      .boot-content p { margin: 7px 0 18px; color: #55705F; font-size: .83rem; }
      .boot-track { height: 5px; overflow: hidden; border-radius: 10px; background: #E2EDE0; }
      .boot-track span { display: block; width: 35%; height: 100%; border-radius: inherit; background: #65A66F; animation: boot-progress 1.25s ease-in-out infinite alternate; }
      .boot-retry { display: block; margin-top: 20px; color: #174B35; font-size: .75rem; animation: boot-retry-show 0s 10s both; }
      @keyframes boot-progress { to { transform: translateX(185%); } }
      @keyframes boot-retry-show { from { visibility: hidden; } to { visibility: visible; } }
      @media (prefers-reduced-motion: reduce) { .boot-track span { width: 100%; animation: none; } }
    </style>
  </head>
  <body>
    <div id="root">
      <main class="boot-screen" role="status" aria-live="polite">
        <div class="boot-content">
          <div class="boot-mark" aria-hidden="true">↻</div>
          <strong>ECO-TAP</strong>
          <p>Preparing your staff portal…</p>
          <div class="boot-track" aria-hidden="true"><span></span></div>
          <a class="boot-retry" href="portal.html">Taking a while? Reload the page</a>
        </div>
      </main>
    </div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
